/* Simple storage that works on any web host (saved in this browser). */
window.storage = {
  async get(k){ const v = localStorage.getItem(k); if (v === null) throw new Error("no key"); return { key:k, value:v }; },
  async set(k,v){ localStorage.setItem(k,v); return { key:k, value:v }; },
  async delete(k){ localStorage.removeItem(k); return { key:k, deleted:true }; },
  async list(p=""){ return { keys: Object.keys(localStorage).filter(x => x.startsWith(p)) }; }
};

/* ---------------------------------------------------------------- helpers */
const slug = (e) => "lc_" + String(e).toLowerCase().replace(/[^a-z0-9]/g, "_");
const words = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);
const niceName = (email) =>
  String(email).split("@")[0].replace(/[._\d]+/g, " ").trim()
    .split(" ").filter(Boolean).map((s) => s[0].toUpperCase() + s.slice(1)).join(" ") || "Student";

async function loadProgress(email) {
  try {
    const r = await window.storage.get(slug(email));
    return r ? JSON.parse(r.value) : null;
  } catch { return null; }
}
async function saveProgress(email, data) {
  try { await window.storage.set(slug(email), JSON.stringify(data)); } catch { /* offline is fine */ }
}

/* ============================================================ main app */
function LetsChatApp() {
  const [student, setStudent] = useState(null);
  const [stage, setStage] = useState("login");
  const [unlocked, setUnlocked] = useState(0);
  const [d, setD] = useState({
    seenWords: [], rows: [{ a: "", d: "", l: "" }, { a: "", d: "", l: "" }, { a: "", d: "", l: "" }],
    picks: { dPro: [], dCon: [], lPro: [], lCon: [] },
    paras: { dPro: "", dCon: "", lPro: "", lCon: "" },
    usedPhrases: [], acted: false, myWord: null,
  });

    const next = { ...prev, ...patch };
    if (student) saveProgress(student.email, next);
    return next;
  });

  const go = (id) => {
    const i = STAGES.findIndex((s) => s.id === id);
    setUnlocked((u) => Math.max(u, i));
    setStage(id);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  /* ---- scoring against the two learning objectives ---- */
  const diffCount = d.rows.filter((r) => r.a.trim() && r.d.trim() && r.l.trim()).length;
  const proCount = Math.min(d.picks.dPro.length, d.picks.lPro.length);
  const conCount = Math.min(d.picks.dCon.length, d.picks.lCon.length);
  const obj1 = diffCount >= 3;
  const obj2 = d.picks.dPro.length >= 3 && d.picks.dCon.length >= 3 && d.picks.lPro.length >= 3 && d.picks.lCon.length >= 3;

  return (
    <div className="min-h-screen w-full" style={{ background: `radial-gradient(circle at 15% 0%, ${C.sky}, ${C.paper} 55%)`, color: C.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@600;800&display=swap');
        .lc-in { animation: lcIn .35s ease-out both; }
        @keyframes lcIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }
        .lc-pulse { animation: lcPulse 2.4s ease-in-out infinite; }
        @keyframes lcPulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        @media (prefers-reduced-motion: reduce){ .lc-in,.lc-pulse{animation:none} }
        textarea, input { outline: none; }
        textarea:focus, input:focus { box-shadow: 0 0 0 3px ${C.amber}; }
      `}</style>

      <header className="px-4 pt-5 pb-1 max-w-5xl mx-auto">
        <div className="flex items-end gap-3 flex-wrap">
          <h1 className="text-3xl sm:text-4xl font-bold leading-none" style={{ fontFamily: DISPLAY }}>
            LET&apos;S CHAT<span style={{ color: C.magenta }}>_</span>
          </h1>
          <p className="text-xs sm:text-sm" style={{ fontFamily: MONO }}>
            FORM 4 &nbsp;·&nbsp; SPEAKING 2.1.3 + WRITING 4.1.5 &nbsp;·&nbsp; SMK RPS BETAU K11
          </p>
          {student && (
            <span className="ml-auto text-xs px-3 py-1" style={{ fontFamily: MONO, border: `2px solid ${C.ink}`, borderRadius: 99, background: "#fff" }}>
              👤 {student.name}
            </span>
          )}
        </div>
      </header>

      {student && <Keycaps stage={stage} setStage={setStage} unlocked={unlocked} />}

      <main className="max-w-5xl mx-auto px-4 pb-16">
        {stage === "login" && <Login onIn={async (s) => {
          setStudent(s);
          const saved = await loadProgress(s.email);
          if (saved) setD(saved);
          setUnlocked(1); setStage("mime");
        }} />}

        {stage === "mime" && <Mime d={d} upd={upd} next={() => go("explore")} />}
        {stage === "explore" && <Explore next={() => go("table")} />}
        {stage === "table" && <Differences d={d} upd={upd} count={diffCount} next={() => go("proscons")} />}
        {stage === "proscons" && <ProsCons d={d} upd={upd} next={() => go("write")} />}
        {stage === "write" && <Writing d={d} upd={upd} next={() => go("speak")} />}
        {stage === "speak" && <Speaking d={d} upd={upd} next={() => go("wall")} />}
        {stage === "wall" && <Wall d={d} upd={upd} student={student} obj1={obj1} obj2={obj2} diffCount={diffCount} proCount={proCount} conCount={conCount} />}
      </main>
    </div>
  );
}

/* ------------------------------------------------------------- 0. LOGIN */
function Login({ onIn }) {
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());

  const enter = () => {
    if (!ok) { setErr("That does not look like an email. Example: ahmad.ali@moe-dl.edu.my"); return; }
    onIn({ email: email.trim().toLowerCase(), name: niceName(email) });
  };

  return (
    <div className="lc-in">
      <Panel title="DELIMa sign in" color={C.amber}>
        <div className="grid sm:grid-cols-2 gap-6 items-center">
          <div className="flex justify-center gap-2 lc-pulse">
            <Machine type="desktop" glow />
            <Machine type="laptop" glow />
          </div>
          <div>
            <p className="mb-3 text-lg font-bold" style={{ fontFamily: DISPLAY }}>Type your DELIMa ID to begin.</p>
            <p className="mb-3 text-sm">Your DELIMa ID is your school Google email, for example <span style={{ fontFamily: MONO }}>ahmad.ali@moe-dl.edu.my</span>.</p>
            <input
              value={email}
              onChange={(e) => { setEmail(e.target.value); setErr(""); }}
              onKeyDown={(e) => e.key === "Enter" && enter()}
              placeholder="yourname@moe-dl.edu.my"
              className="w-full px-4 py-3 mb-3"
              style={{ fontFamily: MONO, border: `3px solid ${C.ink}`, borderRadius: 12, background: "#fff" }}
            />
            {err && <p className="text-sm mb-3 font-semibold" style={{ color: C.magenta }}>{err}</p>}
            <Btn onClick={enter} color={C.violet}>Start the lesson →</Btn>
            <p className="mt-4 text-xs" style={{ color: "#4B5573" }}>
              This is a classroom activity, not the real DELIMa portal. Your ID is only used to keep your own work on this device — no password is asked for, so never type your password here.
            </p>
          </div>
        </div>
      </Panel>

      <Panel title="For the teacher" color={C.sky}>
        <ul className="text-sm space-y-1">
          <li><b>Theme:</b> Science and Technology · <b>Topic:</b> 1. Let&apos;s Chat</li>
          <li><b>Main skill:</b> 2.0 Speaking — 2.1.3 explain advantages and disadvantages</li>
          <li><b>Complementary:</b> 4.0 Writing — 4.1.5 organise, sequence and develop ideas in several paragraphs</li>
          <li><b>Objective 1:</b> fill in the table with at least three differences → screen F3</li>
          <li><b>Objective 2:</b> explain at least three advantages and disadvantages → screens F4–F6</li>
          <li><b>Flow:</b> F1 pre-lesson mime game · F2–F6 lesson development · F7 post-lesson reflection</li>
        </ul>
      </Panel>
    </div>
  );
}

/* --------------------------------------------------------- 1. PRE-LESSON */
function Mime({ d, upd, next }) {
  const [i, setI] = useState(0);
  const [show, setShow] = useState(false);
  const [reveal, setReveal] = useState(false);
  const [t, setT] = useState(30);
  const [run, setRun] = useState(false);
  const tick = useRef(null);

  useEffect(() => {
    if (run) {
      tick.current = setInterval(() => setT((x) => (x <= 1 ? (setRun(false), 0) : x - 1)), 1000);
      return () => clearInterval(tick.current);
    }
  }, [run]);

  const card = MIME_WORDS[i];
  const draw = () => {
    const n = Math.floor(Math.random() * MIME_WORDS.length);
    setI(n); setShow(false); setReveal(false); setT(30); setRun(false);
    if (!d.seenWords.includes(MIME_WORDS[n].w)) upd({ seenWords: [...d.seenWords, MIME_WORDS[n].w] });
  };

  return (
    <div className="lc-in">
      <Panel title="F1 · Pre-lesson — mime and guess" color={C.magenta}
        right={<span className="text-xs font-bold" style={{ fontFamily: MONO }}>{d.seenWords.length}/{MIME_WORDS.length} words</span>}>
        <p className="mb-4 text-sm">One pupil comes to the front, taps <b>Show my word</b>, and mimes the action. The class guesses. No speaking, no writing on the board!</p>

        <div className="text-center p-6 mb-4" style={{ border: `3px dashed ${C.ink}`, borderRadius: 16, background: C.sky }}>
          {!show ? (
            <>
              <div className="text-5xl mb-3">🤫</div>
              <Btn onClick={() => setShow(true)} color={C.magenta}>Show my word</Btn>
            </>
          ) : (
            <>
              <div className="text-4xl sm:text-5xl font-bold mb-2" style={{ fontFamily: DISPLAY }}>{card.w}</div>
              {reveal ? (
                <p className="text-base"><b>Meaning:</b> {card.m} <span style={{ fontFamily: MONO, color: C.violet }}>· BM: {card.bm}</span></p>
              ) : (
                <Btn small light onClick={() => setReveal(true)}>Show the meaning</Btn>
              )}
            </>
          )}
        </div>

        <div className="flex flex-wrap items-center gap-3">
          <div className="px-4 py-2 text-2xl font-bold" style={{ fontFamily: MONO, border: `3px solid ${C.ink}`, borderRadius: 12, background: t <= 5 ? C.magenta : "#fff", color: t <= 5 ? "#fff" : C.ink }}>
            {String(Math.floor(t / 60)).padStart(2, "0")}:{String(t % 60).padStart(2, "0")}
          </div>
          <Btn small color={C.lime} onClick={() => setRun((r) => !r)}>{run ? "Pause" : "Start timer"}</Btn>
          <Btn small light onClick={() => { setT(30); setRun(false); }}>Reset</Btn>
          <Btn small color={C.violet} onClick={draw}>Next word 🎲</Btn>
          <span className="ml-auto"><Btn onClick={next} color={C.cyan}>Next: two computers →</Btn></span>
        </div>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------ 2. LESSON DEV A */

  return (
    <div className="lc-in">
      <Panel title="F2 · Look at the two computers" color={C.cyan}>
        <div className="grid sm:grid-cols-2 gap-4">
          {[["desktop", "DESKTOP COMPUTER", C.cyan], ["laptop", "LAPTOP COMPUTER", C.lime]].map(([k, t, col]) => (
            <div key={k} className="p-4 text-center" style={{ border: `3px solid ${C.ink}`, borderRadius: 14, background: col }}>
              <div className="flex justify-center"><Machine type={k} glow /></div>
              <p className="mt-2 font-bold" style={{ fontFamily: MONO }}>{t}</p>

        <p className="mt-4 text-sm">Look carefully. What do you <b>see</b> that is different? What do you think is <b>good</b> and <b>bad</b> about each one?</p>

      <Panel title="Useful words — tap for the meaning" color={C.violet}>

      </Panel>

      <Panel title="Phrases for comparing" color={C.amber}>
        <ul className="space-y-2">
          {PHRASES.map((p) => (

        <div className="mt-4"><Btn onClick={next} color={C.magenta}>Next: fill in the table →</Btn></div>

}

/* -------------------------------------------------- 3. OBJECTIVE 1 TABLE */
function Differences({ d, upd, count, next }) {
  const set = (i, field, v) => {
    const rows = d.rows.map((r, k) => (k === i ? { ...r, [field]: v } : r));
    upd({ rows });
  };
  const cell = { fontFamily: MONO, border: `2px solid ${C.ink}`, borderRadius: 8, padding: "8px", width: "100%", background: "#fff", fontSize: 14 };

  return (
    <div className="lc-in">
      <Panel title="F3 · Objective 1 — at least three differences" color={C.cyan}
        right={<span className="text-xs font-bold" style={{ fontFamily: MONO }}>{count}/3 done</span>}>
        <p className="mb-3 text-sm">Choose an aspect, then write what each computer is like. Tap an aspect below to fill the first empty row.</p>
        <div className="flex flex-wrap mb-4">
          {ASPECTS.map((a) => (
            <Chip key={a} color={C.sky} onClick={() => {
              const i = d.rows.findIndex((r) => !r.a.trim());
              if (i >= 0) set(i, "a", a);
            }}>{a}</Chip>
          ))}
        </div>

        <div className="overflow-x-auto">
          <table className="w-full" style={{ borderCollapse: "separate", borderSpacing: 6, minWidth: 520 }}>
            <thead>
              <tr>
                {["Aspect", "🖥️ Desktop", "💻 Laptop"].map((h, i) => (
                  <th key={h} className="text-left px-3 py-2 text-sm font-bold"
                    style={{ fontFamily: MONO, border: `3px solid ${C.ink}`, borderRadius: 10, background: [C.amber, C.cyan, C.lime][i] }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {d.rows.map((r, i) => (
                <tr key={i}>
                  <td><input style={cell} value={r.a} onChange={(e) => set(i, "a", e.target.value)} placeholder="e.g. Portability" /></td>
                  <td><input style={cell} value={r.d} onChange={(e) => set(i, "d", e.target.value)} placeholder="e.g. stays on the table" /></td>
                  <td><input style={cell} value={r.l} onChange={(e) => set(i, "l", e.target.value)} placeholder="e.g. can be carried" /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="flex flex-wrap gap-3 items-center mt-4">
          <Btn small light onClick={() => upd({ rows: [...d.rows, { a: "", d: "", l: "" }] })}>+ Add a row</Btn>
          {count >= 3
            ? <span className="font-bold" style={{ color: C.lime }}>✓ Objective 1 achieved — three differences written.</span>
            : <span className="text-sm">Complete {3 - count} more full row{3 - count > 1 ? "s" : ""} to reach the objective.</span>}
          <span className="ml-auto"><Btn onClick={next} color={C.magenta} disabled={count < 3}>Next: good & bad →</Btn></span>
        </div>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------- 4. OBJECTIVE 2 BOXES */
function ProsCons({ d, upd, next }) {
  const [typed, setTyped] = useState({ dPro: "", dCon: "", lPro: "", lCon: "" });
  const toggle = (box, item) => {
    const cur = d.picks[box];
    const nextList = cur.includes(item) ? cur.filter((x) => x !== item) : [...cur, item];
    upd({ picks: { ...d.picks, [box]: nextList } });
  };
  const add = (box) => {
    const v = typed[box].trim();
    if (!v) return;
    upd({ picks: { ...d.picks, [box]: [...d.picks[box], v] } });
    setTyped({ ...typed, [box]: "" });
  };
  const all = BOXES.every((b) => d.picks[b.id].length >= 3);

  return (
    <div className="lc-in">
      <Panel title="F4 · Objective 2 — three good points and three bad points each" color={C.violet}>
        <p className="text-sm mb-2">Tap the ideas you agree with, or type your own. You need <b>at least 3 in every box</b>.</p>
      </Panel>

      <div className="grid sm:grid-cols-2 gap-0 sm:gap-4">
        {BOXES.map((b) => (
          <Panel key={b.id} title={`${b.icon} ${b.title}`} color={b.color}
            right={<span className="text-xs font-bold" style={{ fontFamily: MONO }}>{d.picks[b.id].length}/3</span>}>
            <div className="flex flex-wrap mb-3">
              {BANK[b.id].map((s) => (
                <Chip key={s} color={b.color} active={d.picks[b.id].includes(s)} onClick={() => toggle(b.id, s)}>{s}</Chip>
              ))}
            </div>
            <div className="flex gap-2">
              <input value={typed[b.id]} onChange={(e) => setTyped({ ...typed, [b.id]: e.target.value })}
                onKeyDown={(e) => e.key === "Enter" && add(b.id)} placeholder="my own idea..."
                className="flex-1 px-3 py-2 text-sm" style={{ fontFamily: MONO, border: `2px solid ${C.ink}`, borderRadius: 10 }} />
              <Btn small color={C.ink} onClick={() => add(b.id)}>Add</Btn>
            </div>
            {d.picks[b.id].length > 0 && (
              <ul className="mt-3 text-sm space-y-1">
                {d.picks[b.id].map((s) => (
                  <li key={s} className="flex gap-2 items-start">
                    <span style={{ color: b.color }}>▶</span><span className="flex-1">{s}</span>
                    <button onClick={() => toggle(b.id, s)} style={{ color: C.magenta, fontWeight: 700 }}>✕</button>
                  </li>
                ))}
              </ul>
            )}
          </Panel>
        ))}
      </div>

      <Panel title="Check" color={all ? C.lime : C.sky}>
        {all
          ? <p className="font-bold" style={{ color: C.ink }}>✓ Objective 2 on track — you can explain three advantages and three disadvantages of both computers.</p>
          : <p className="text-sm">Keep going — every box needs three points before you write.</p>}
        <div className="mt-3"><Btn onClick={next} color={C.magenta} disabled={!all}>Next: write four paragraphs →</Btn></div>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------- 5. WRITING 4.1.5 */
function Writing({ d, upd, next }) {
  const [copied, setCopied] = useState(false);
  const starter = {
    dPro: "A desktop computer has several advantages. Firstly, it is",
    dCon: "However, a desktop computer also has some disadvantages. To begin with, it is",
    lPro: "On the other hand, a laptop has many advantages. The main one is that it is",
    lCon: "In contrast, a laptop has a few drawbacks as well. One drawback is that it is",
  };
  const fill = (id) => {
    const list = d.picks[id];
    const text = `${starter[id]} ${list[0]}. Secondly, it is ${list[1] || "..."}. Finally, it is ${list[2] || "..."}.`;
    upd({ paras: { ...d.paras, [id]: text } });
  };
  const full = BOXES.map((b) => d.paras[b.id]).filter(Boolean).join("\n\n");
  const total = words(full);

  return (
    <div className="lc-in">
      <Panel title="F5 · Write your text — four paragraphs" color={C.amber}
        right={<span className="text-xs font-bold" style={{ fontFamily: MONO }}>{total} words</span>}>
        <p className="text-sm">One paragraph for each box in your table. Use the linking phrases: <i>firstly, secondly, however, on the other hand, in contrast, finally</i>.</p>
      </Panel>

      {BOXES.map((b, i) => (
        <Panel key={b.id} title={`Paragraph ${i + 1} · ${b.title}`} color={b.color}
          right={<span className="text-xs font-bold" style={{ fontFamily: MONO }}>{words(d.paras[b.id])} w</span>}>
          <div className="flex flex-wrap gap-1 mb-2 text-xs" style={{ fontFamily: MONO }}>
            {d.picks[b.id].map((s) => <span key={s} className="px-2 py-1" style={{ border: `1px solid ${C.ink}`, borderRadius: 99 }}>{s}</span>)}
          </div>
          <textarea rows={4} value={d.paras[b.id]} onChange={(e) => upd({ paras: { ...d.paras, [b.id]: e.target.value } })}
            placeholder={starter[b.id] + " ..."} className="w-full p-3 text-sm"
            style={{ fontFamily: "inherit", border: `2px solid ${C.ink}`, borderRadius: 10 }} />
          <div className="mt-2"><Btn small light onClick={() => fill(b.id)}>Start me off with my points</Btn></div>
        </Panel>
      ))}

      <Panel title="My finished text" color={C.lime}>
        <div className="p-3 text-sm whitespace-pre-wrap" style={{ border: `2px dashed ${C.ink}`, borderRadius: 10, background: "#fff", minHeight: 80 }}>
          {full || "Your four paragraphs will appear here."}
        </div>
        <div className="flex flex-wrap gap-3 mt-3">
          <Btn small light onClick={() => { navigator.clipboard?.writeText(full); setCopied(true); setTimeout(() => setCopied(false), 1500); }}>
            {copied ? "Copied ✓" : "Copy my text"}
          </Btn>
          <Btn onClick={next} color={C.magenta} disabled={total < 40}>Next: talk in pairs →</Btn>
        </div>
        {total < 40 && <p className="text-xs mt-2">Write at least 40 words in total to move on.</p>}
      </Panel>
    </div>
  );
}

/* ---------------------------------------------------- 6. SPEAKING 2.1.3 */
function Speaking({ d, upd, next }) {
  const [p, setP] = useState(0);
  const [t, setT] = useState(180);
  const [run, setRun] = useState(false);
  useEffect(() => {
    if (!run) return;
    const id = setInterval(() => setT((x) => (x <= 1 ? (setRun(false), 0) : x - 1)), 1000);
    return () => clearInterval(id);
  }, [run]);

  const togglePhrase = (ph) => {
    const cur = d.usedPhrases;
    upd({ usedPhrases: cur.includes(ph) ? cur.filter((x) => x !== ph) : [...cur, ph] });
  };

  return (
    <div className="lc-in">
      <Panel title="F6 · Talk with your partner" color={C.cyan}
        right={<span className="text-xs font-bold" style={{ fontFamily: MONO }}>{String(Math.floor(t / 60)).padStart(2, "0")}:{String(t % 60).padStart(2, "0")}</span>}>
        <div className="p-5 mb-4 text-center" style={{ border: `3px solid ${C.ink}`, borderRadius: 14, background: C.sky }}>
          <p className="text-xs mb-2" style={{ fontFamily: MONO }}>PROMPT {p + 1} OF {DIALOGUE.length}</p>
          <p className="text-lg font-bold" style={{ fontFamily: DISPLAY }}>{DIALOGUE[p]}</p>
        </div>
        <div className="flex flex-wrap gap-3 mb-4">
          <Btn small color={C.violet} onClick={() => setP((x) => (x + 1) % DIALOGUE.length)}>Another prompt</Btn>
          <Btn small color={C.lime} onClick={() => setRun((r) => !r)}>{run ? "Pause" : "Start 3 minutes"}</Btn>
          <Btn small light onClick={() => { setT(180); setRun(false); }}>Reset</Btn>
        </div>
        <p className="text-sm mb-2 font-bold">Tick each phrase after you have really used it while speaking:</p>
        <div className="flex flex-wrap">
          {PHRASES.map((ph) => (
            <Chip key={ph} color={C.lime} active={d.usedPhrases.includes(ph)} onClick={() => togglePhrase(ph)}>
              {d.usedPhrases.includes(ph) ? "✓ " : ""}{ph.slice(0, 34)}{ph.length > 34 ? "…" : ""}
            </Chip>
          ))}
        </div>
        <label className="flex items-center gap-2 mt-4 text-sm font-bold cursor-pointer">
          <input type="checkbox" checked={d.acted} onChange={(e) => upd({ acted: e.target.checked })} style={{ width: 20, height: 20 }} />
          We acted out our dialogue in front of the class 🎭
        </label>
        <div className="mt-4"><Btn onClick={next} color={C.magenta}>Next: word wall →</Btn></div>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------- 7. POST-LESSON */
function Wall({ d, upd, student, obj1, obj2, diffCount }) {
  const [w, setW] = useState(d.myWord?.word || "");
  const [m, setM] = useState(d.myWord?.meaning || "");
  const [s, setS] = useState(d.myWord?.sentence || "");
  const [wall, setWall] = useState([]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const refresh = async () => {
    setBusy(true); setMsg("");
    try {
      const res = await window.storage.list("lcwall:", true);
      const keys = (res?.keys || []).slice(0, 60);
      const out = [];
      for (const k of keys) {
        try { const r = await window.storage.get(k, true); if (r) out.push(JSON.parse(r.value)); } catch { /* skip */ }
      }
      setWall(out.reverse());
      if (out.length === 0) setMsg("The wall is empty. Be the first to add a word.");
    } catch { setMsg("Could not load the wall right now. Your own word is still saved."); }
    setBusy(false);
  };
  useEffect(() => { refresh(); }, []);

  const share = async () => {
    if (!w.trim()) { setMsg("Type a word or expression first."); return; }
    const entry = { word: w.trim(), meaning: m.trim(), sentence: s.trim(), by: student.name.split(" ")[0], at: Date.now() };
    upd({ myWord: entry });
    setBusy(true);
    try {
      await window.storage.set("lcwall:" + student.email.replace(/[^a-z0-9]/g, "_"), JSON.stringify(entry), true);
      await refresh();
    } catch { setMsg("Saved on your device, but the class wall is not reachable."); }
    setBusy(false);
  };

  const stars = [obj1, obj2, words(Object.values(d.paras).join(" ")) >= 40, d.usedPhrases.length >= 3, !!d.myWord].filter(Boolean).length;

  return (
    <div className="lc-in">
      <Panel title="F7 · Post-lesson — one new word or expression" color={C.magenta}>
        <p className="text-sm mb-3">Talk to your partner. Choose <b>one</b> new word or expression you learned today, then share it with the class.</p>
        <div className="grid sm:grid-cols-3 gap-2">
          <input value={w} onChange={(e) => setW(e.target.value)} placeholder="word / expression" className="px-3 py-2 text-sm" style={{ fontFamily: MONO, border: `2px solid ${C.ink}`, borderRadius: 10 }} />
          <input value={m} onChange={(e) => setM(e.target.value)} placeholder="meaning (English or BM)" className="px-3 py-2 text-sm" style={{ border: `2px solid ${C.ink}`, borderRadius: 10 }} />
          <input value={s} onChange={(e) => setS(e.target.value)} placeholder="my own sentence" className="px-3 py-2 text-sm" style={{ border: `2px solid ${C.ink}`, borderRadius: 10 }} />
        </div>
        <div className="flex flex-wrap gap-3 mt-3 items-center">
          <Btn onClick={share} color={C.violet} disabled={busy}>Share with the class</Btn>
          <Btn small light onClick={refresh} disabled={busy}>{busy ? "Loading…" : "Refresh wall"}</Btn>
          <span className="text-xs" style={{ color: "#4B5573" }}>Everyone using this app can see what you post here.</span>
        </div>
        {msg && <p className="text-sm mt-2 font-semibold" style={{ color: C.magenta }}>{msg}</p>}
      </Panel>

      <Panel title="Class word wall" color={C.lime}>
        {wall.length === 0 ? <p className="text-sm">No words yet.</p> : (
          <div className="grid sm:grid-cols-2 gap-3">
            {wall.map((e, i) => (
              <div key={i} className="p-3" style={{ border: `2px solid ${C.ink}`, borderRadius: 12, background: [C.sky, "#FFF3D6", "#E3FBD8", "#FFE1EE"][i % 4] }}>
                <p className="font-bold" style={{ fontFamily: DISPLAY, fontSize: 18 }}>{e.word}</p>
                {e.meaning && <p className="text-sm">{e.meaning}</p>}
                {e.sentence && <p className="text-sm italic">“{e.sentence}”</p>}
                <p className="text-xs mt-1" style={{ fontFamily: MONO }}>— {e.by}</p>
              </div>
            ))}
          </div>
        )}
      </Panel>

      <Panel title="My lesson report" color={C.amber}>
        <p className="text-3xl mb-2">{"⭐".repeat(stars)}{"☆".repeat(5 - stars)}</p>
        <ul className="text-sm space-y-1">
          <li>{obj1 ? "✅" : "⬜"} Objective 1 — {diffCount} differences written in the table</li>
          <li>{obj2 ? "✅" : "⬜"} Objective 2 — three advantages and disadvantages of both computers</li>
          <li>{words(Object.values(d.paras).join(" ")) >= 40 ? "✅" : "⬜"} Four paragraphs written ({words(Object.values(d.paras).join(" "))} words)</li>
          <li>{d.usedPhrases.length >= 3 ? "✅" : "⬜"} Used {d.usedPhrases.length} comparing phrases while speaking{d.acted ? " · acted out in class 🎭" : ""}</li>
          <li>{d.myWord ? "✅" : "⬜"} Shared a new word with the class</li>
        </ul>
        <div className="mt-4"><Btn light small onClick={() => window.print()}>Print or save as PDF</Btn></div>
      </Panel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LetsChatApp />);
</script>
</body>
